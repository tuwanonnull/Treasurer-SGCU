<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ทดลองสตาฟและคำขอ</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap"><link rel="stylesheet" href="/css/core/base.css"><link rel="stylesheet" href="/css/pages/login-staff.css"><link rel="stylesheet" href="/css/components/ui.css"><style>
:root{--surface:#fff;--text:#374151;--muted:#6b7280;--border:#f0dfe8;--accent:#9d174d;--soft:#fff5fa}html[data-theme=dark]{color-scheme:dark;--surface:#222;--text:#f2f2f2;--muted:#b8b8b8;--border:#404040;--accent:#f9a8d4;--soft:#30252b}html[data-theme=dark] body{background:#181818}body{color:var(--text)}main{max-width:960px;margin:auto;padding:24px 20px}h1{font-size:22px;color:var(--accent);margin:0}h2{font-size:17px;margin:0}p{margin:6px 0;color:var(--muted);font-size:13px}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #ec4899;outline-offset:3px}[hidden]{display:none!important}.top,.heading,.toolbar,.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:24px;font-size:12px;color:var(--muted)}.heading{align-items:flex-start;margin-bottom:24px}.plain{border:1px solid var(--border);border-radius:999px;padding:9px 16px;min-height:42px;background:var(--surface);color:var(--accent);white-space:nowrap}.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px}.tabs{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:4px}.tab{border:0;background:none;border-radius:999px;padding:10px 20px;color:var(--muted)}.tab[aria-selected=true]{background:var(--surface);color:var(--accent);box-shadow:0 2px 8px #0000000a}.toolbar{margin-bottom:16px}.search{display:block;width:100%;box-sizing:border-box;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:12px;margin:16px 0}.person{display:flex;align-items:center;gap:12px;padding:18px 4px;border-top:1px solid var(--border)}.person-main{flex:1;text-align:left;border:0;background:none;color:var(--text);padding:0;min-height:44px}.person-main strong{display:block;font-weight:400;font-size:14px}.person-main small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.arrow{color:var(--accent)}.bulk{position:sticky;bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 5px 25px #0001}.bulk button{padding:8px 12px}.danger{color:#be123c}dialog{width:min(430px,calc(100% - 32px));box-sizing:border-box;border:1px solid var(--border);border-radius:20px;padding:20px;background:var(--surface);color:var(--text);max-height:85dvh;overflow:auto}dialog::backdrop{background:#0006}.sheet-head{margin-bottom:16px}.menu-item{display:block;width:100%;text-align:left;padding:18px 8px;background:none;border:0;border-top:1px solid var(--border);text-decoration:none;color:var(--text);box-sizing:border-box}.menu-item small{display:block;color:var(--muted);margin-top:4px;font-size:12px}.field{display:grid;gap:8px;margin:16px 0;font-size:13px}.field select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px;width:100%}.primary{background:#db2777;color:white;border:0;border-radius:999px;padding:11px 20px;min-height:44px}.sheet-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.note{font-size:12px;color:var(--muted)}@media(max-width:600px){main{padding:16px 12px}.heading{gap:10px}h1{font-size:21px}.panel{padding:14px}.tab{padding:9px 12px;font-size:13px}.toolbar{gap:8px}.toolbar>.plain{font-size:12px;padding:9px 12px}dialog.sheet{width:100%;max-width:none;margin:auto 0 0;border-radius:22px 22px 0 0;padding:20px 20px max(24px,env(safe-area-inset-bottom))}.bulk{flex-wrap:wrap}.top{flex-wrap:wrap}}

.mobile-staff-actions{display:none}
@media(max-width:840px){
main{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
#manage,.toolbar{display:none}
.mobile-staff-actions{position:fixed;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:76;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:5px;border:1px solid rgba(236,72,153,.16);border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 16px 38px rgba(15,23,42,.14);backdrop-filter:blur(18px)}
.mobile-staff-action{appearance:none;position:relative;min-width:0;min-height:40px;border:0;border-radius:11px;background:transparent;color:#64748b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;font-family:inherit;font-size:10px;font-weight:700;line-height:1.1;text-align:center;white-space:nowrap;text-decoration:none}
.mobile-staff-action svg{display:block;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mobile-staff-action:is(:hover,:focus-visible){background:rgba(255,241,242,.72);color:#be185d}
.mobile-staff-action[aria-pressed=true],.mobile-staff-action[aria-current=page]{background:linear-gradient(135deg,#fff7fb,#ffe4f1);color:#9d174d;box-shadow:0 8px 18px rgba(157,23,77,.12)}
.mobile-staff-action.has-filters::after{content:'';position:absolute;top:3px;right:12px;width:6px;height:6px;border-radius:50%;background:#ec4899}
.bulk{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
html[data-theme=dark] .mobile-staff-actions{background:rgba(34,34,34,.96);border-color:var(--border)}
html[data-theme=dark] .mobile-staff-action{color:var(--muted)}
html[data-theme=dark] .mobile-staff-action:is(:hover,[aria-pressed=true],[aria-current=page]){background:var(--soft);color:var(--accent);box-shadow:none}
}
</style></head><body><main><div class="top"><span>หน้าทดลองการจัดวาง · รายชื่อสมมติ</span><button class="plain" id="theme">Dark mode</button></div><header class="heading"><div><h1>สตาฟและคำขอ</h1><p>ตรวจคำขอและจัดการสมาชิกสตาฟ</p></div><button class="plain" id="manage" aria-haspopup="dialog">จัดการ ⋯</button></header><section class="panel"><div class="toolbar"><div class="tabs" role="tablist" aria-label="รายการสตาฟ"><button class="tab" role="tab" aria-selected="true" data-view="pending">คำขอ</button><button class="tab" role="tab" aria-selected="false" data-view="current">สตาฟปัจจุบัน</button></div><button id="filters" class="plain" aria-haspopup="dialog">ตัวกรอง</button></div><input class="search" id="search" type="search" aria-label="ค้นหาสมาชิก" placeholder="ค้นหาชื่อ อีเมล หรือตำแหน่ง"><p id="count" aria-live="polite"></p><div id="people"></div><div id="bulk" class="bulk" hidden><span id="selected-count"></span><button class="plain" id="cancel-selection">ยกเลิก</button><button class="plain danger" id="bulk-action">ลบคำขอ</button></div><p id="status" role="status"></p></section></main>
<dialog id="manage-sheet" class="sheet" aria-labelledby="manage-title"><div class="sheet-head"><h2 id="manage-title">จัดการ</h2><button class="plain" data-close>ปิด</button></div><a class="menu-item" href="/">ตั้งค่าตำแหน่ง <small>จัดการฝ่าย ตำแหน่ง และหน้าที่อนุญาต</small></a><button class="menu-item" id="select-mode">เลือกหลายรายการ<small>เลือกคำขอหรือสมาชิกเพื่อจัดการพร้อมกัน</small></button></dialog>
<dialog id="filter-sheet" class="sheet" aria-labelledby="filter-title"><div class="sheet-head"><h2 id="filter-title">ตัวกรอง</h2><button class="plain" data-close>ปิด</button></div><label class="field">ฝ่าย<select id="division"><option value="">ทุกฝ่าย</option><option value="02">02 บริหารและพัฒนางบประมาณ</option><option value="03">03 หาทุนและสิทธิประโยชน์</option><option value="04">04 กายภาพและพัสดุ</option></select></label><label class="field">ตำแหน่ง<select id="level"><option value="">ทุกตำแหน่ง</option><option>ประธานฝ่าย</option><option>ผู้ช่วยฝ่าย</option></select></label><label class="field">เรียงลำดับ<select id="sort"><option value="newest">ใหม่สุดก่อน</option><option value="oldest">เก่าสุดก่อน</option><option value="name">ชื่อตามตัวอักษร</option></select></label><div class="sheet-actions"><button class="plain" id="clear">ล้างตัวกรอง</button><button class="primary" id="apply">แสดงรายการ</button></div></dialog>
<dialog id="detail" class="sheet" aria-labelledby="detail-title"><div class="sheet-head"><h2 id="detail-title"></h2><button class="plain" data-close>ปิด</button></div><p id="detail-info"></p><p class="note">ข้อมูลสมมติสำหรับลองตำแหน่งปุ่ม ไม่มีผลต่อบัญชีจริง</p><div class="sheet-actions" id="detail-actions"></div></dialog>

<nav class="mobile-staff-actions" aria-label="เมนูย่อยสตาฟและคำขอ">
<button class="mobile-staff-action" id="mobile-filters" aria-haspopup="dialog" aria-label="เปิดตัวกรอง"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.25 4.25"/></svg><span>ตัวกรอง</span></button>
<button class="mobile-staff-action" id="mobile-pending" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v4H9zM9 14l2 2 4-4"/></svg><span>คำขอ</span></button>
<button class="mobile-staff-action" id="mobile-current"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/></svg><span>สตาฟ</span></button>
<a class="mobile-staff-action" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M9 5V3h6v2M4 11h16M10 11v3h4v-3"/></svg><span>ตำแหน่ง</span></a>
<button class="mobile-staff-action" id="mobile-select" aria-pressed="false" aria-label="เลือกหลายรายการ"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m7 12 3 3 7-7"/></svg><span>เลือกรายการ</span></button>
</nav>
<script>
const $=id=>document.getElementById(id);const rows=[{name:'สมาชิกทดลอง ก',division:'02',level:'ผู้ช่วยฝ่าย'},{name:'สมาชิกทดลอง ข',division:'03',level:'ประธานฝ่าย'},{name:'สมาชิกทดลอง ค',division:'04',level:'ผู้ช่วยฝ่าย'},{name:'สมาชิกทดลอง ง',division:'02',level:'ประธานฝ่าย'}];let view='pending',selecting=false;const selected=new Set();let applied={division:'',level:'',sort:'newest'};
function theme(value){document.documentElement.dataset.theme=value;$('theme').textContent=value==='dark'?'Light mode':'Dark mode';try{localStorage.setItem('sgcu-position-preview-theme',value)}catch{}}
let saved;try{saved=localStorage.getItem('sgcu-position-preview-theme')}catch{}theme(saved||'light');$('theme').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
function render(){let list=rows.filter(r=>(!applied.division||r.division===applied.division)&&(!applied.level||r.level===applied.level)&&`${r.name} ${r.level}`.includes($('search').value.trim()));if(applied.sort==='oldest')list.reverse();if(applied.sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'th'));$('count').textContent=`${view==='pending'?'คำขอที่รออนุมัติ':'สตาฟปัจจุบัน'} · ${list.length} รายการ`;$('people').replaceChildren();list.forEach(r=>{const item=document.createElement('div');item.className='person';if(selecting){const box=document.createElement('input');box.type='checkbox';box.checked=selected.has(r.name);box.setAttribute('aria-label',`เลือก ${r.name}`);box.onchange=()=>{box.checked?selected.add(r.name):selected.delete(r.name);updateBulk()};item.append(box)}const button=document.createElement('button');button.className='person-main';const name=document.createElement('strong');name.textContent=r.name;const meta=document.createElement('small');meta.textContent=`ฝ่าย ${r.division} · ${r.level}`;button.append(name,meta);button.onclick=()=>{if(selecting){selected.has(r.name)?selected.delete(r.name):selected.add(r.name);render();return} $('detail-title').textContent=r.name;$('detail-info').textContent=meta.textContent;$('detail-actions').replaceChildren();(view==='pending'?['ไม่อนุมัติ','อนุมัติ']:['แก้ไขข้อมูล']).forEach(label=>{const action=document.createElement('button');action.className=label==='อนุมัติ'?'primary':'plain';action.textContent=label;action.onclick=()=>{$('detail').close();$('status').textContent=`ทดลองกด “${label}” แล้ว — ไม่มีการเปลี่ยนข้อมูลจริง`};$('detail-actions').append(action)});$('detail').showModal()};item.append(button);$('people').append(item)});if(!list.length)$('people').textContent='ไม่พบรายการตามตัวกรอง';updateBulk()}
function syncMobileNav(){
for(const name of ['pending','current']){const button=$('mobile-'+name);if(view===name)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')}
$('mobile-select').setAttribute('aria-pressed',String(selecting));
$('mobile-filters').classList.toggle('has-filters',Boolean(applied.division||applied.level||applied.sort!=='newest'));
}
function updateBulk(){syncMobileNav();$('bulk').hidden=!selecting;$('selected-count').textContent=`เลือก ${selected.size} รายการ`;$('bulk-action').disabled=!selected.size;$('bulk-action').textContent=view==='pending'?'ลบคำขอ':'เพิกถอนสิทธิ์'}
$('manage').onclick=()=>$('manage-sheet').showModal();$('filters').onclick=()=>{for(const key of ['division','level','sort'])$(key).value=applied[key];$('filter-sheet').showModal()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('select-mode').onclick=()=>{selecting=true;selected.clear();$('manage-sheet').close();render()};$('cancel-selection').onclick=()=>{selecting=false;selected.clear();render()};$('bulk-action').onclick=()=>{$('status').textContent=`ทดลองเลือก ${selected.size} รายการ — ไม่มีการลบหรือเพิกถอนสิทธิ์จริง`};$('apply').onclick=()=>{for(const key of ['division','level','sort'])applied[key]=$(key).value;selected.clear();$('filters').textContent=`ตัวกรอง${applied.division||applied.level||applied.sort!=='newest'?' •':''}`;$('filter-sheet').close();render()};$('clear').onclick=()=>{$('division').value='';$('level').value='';$('sort').value='newest'};$('search').oninput=()=>{selected.clear();render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;selecting=false;selected.clear();document.querySelectorAll('[data-view]').forEach(t=>t.setAttribute('aria-selected',String(t===b)));render()});render();

$('mobile-filters').onclick=()=>$('filters').click();
$('mobile-pending').onclick=()=>document.querySelector('[data-view="pending"]').click();
$('mobile-current').onclick=()=>document.querySelector('[data-view="current"]').click();
$('mobile-select').onclick=()=>{selecting=!selecting;selected.clear();render()};
</script></body></html>
